<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Usuarios</h2>
        <a th:href="@{/users/new}" class="btn btn-primary">➕ Nuevo Usuario</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Rol</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.name}">Nombre Usuario</td>
                <td th:text="${u.email}">correo@ejemplo.com</td>
                <td th:text="${u.role}">ROL</td>
                <td>
                    <a th:href="@{'/users/' + ${u.id}}" class="btn btn-sm btn-secondary">Editar</a>
                    <form th:action="@{'/users/' + ${u.id} + '/delete'}" method="post" th:onsubmit="return confirm('¿Está seguro de eliminar este usuario?');" style="display:inline;">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="4" class="text-center text-muted">No hay usuarios registrados.</td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
