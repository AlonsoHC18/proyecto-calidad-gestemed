<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${user.id == null ? 'Nuevo Usuario' : 'Editar Usuario'}">Formulario de Usuario</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h2 th:text="${user.id == null ? 'Crear Nuevo Usuario' : 'Editar Usuario'}"></h2>

    <form th:action="@{/users}" th:object="${user}" method="post">
        <input type="hidden" th:if="*{id != null}" th:field="*{id}"/>

        <!-- Nombre -->
        <div class="mb-3">
            <label for="name" class="form-label">Nombre</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" placeholder="Nombre completo" required>
        </div>

        <!-- Correo -->
        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" id="email" th:field="*{email}" class="form-control"
                   placeholder="usuario@ejemplo.com" required>
            <div class="form-text">Debe ser un correo válido.</div>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" th:field="*{password}" class="form-control"
                   th:placeholder="${user.id != null ? 'Dejar vacío para no cambiar' : 'Contraseña'}"
                   th:required="${user.id == null}">
        </div>

        <!-- Rol -->
        <div class="mb-3">
            <label for="role" class="form-label">Rol</label>
            <select id="role" th:field="*{role}" class="form-select" required>
                <option value="" disabled th:if="${user.role == null}" selected>Seleccione un rol</option>
                <option th:each="r : ${roles}" th:value="${r.roleName}" th:text="${r.roleName}"
                        th:selected="${user.role == r.roleName}"></option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/users}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</div>
</body>
</html>
