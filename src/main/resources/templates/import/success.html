<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Importación Exitosa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .card-success {
            border-radius: 15px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-success">
                <div class="card-body p-5">
                    <h4 class="card-title fw-bold mb-3">¡Éxito!</h4>
                    <p class="card-text fs-5">
                        Se han importado <b th:text="${count}" class="text-success">0</b> registros a la base de datos.
                    </p>

                    <!-- 🔹 Mostrar duplicados si existen -->
                    <div th:if="${duplicates != null and !duplicates.isEmpty()}" class="alert alert-warning mt-4">
                        <h5><i class="bi bi-exclamation-triangle-fill me-2"></i>Registros duplicados</h5>
                        <p>Los siguientes IDs ya existían y no se importaron:</p>
                        <ul class="list-group">
                            <li class="list-group-item" th:each="id : ${duplicates}" th:text="${id}"></li>
                        </ul>
                    </div>

                    <!-- 🔹 Botones de descarga de reportes -->
                    <div class="mt-4 d-flex flex-wrap gap-2">
                        <a th:href="@{/import/report/current/{fileName}(fileName=${fileName})}" 
                           class="btn btn-success" target="_blank">
                            <i class="bi bi-file-earmark-excel me-2"></i>Descargar Excel
                        </a>
                        <a th:href="@{/import/report/current/csv/{fileName}(fileName=${fileName})}" 
                           class="btn btn-info" target="_blank">
                            <i class="bi bi-file-earmark-text me-2"></i>Descargar CSV
                        </a>
                        <a th:href="@{/import/report/current/pdf/{fileName}(fileName=${fileName})}" 
                           class="btn btn-danger" target="_blank">
                            <i class="bi bi-file-earmark-pdf me-2"></i>Descargar PDF
                        </a>
                    </div>
                </div>

                <div class="card-footer bg-light py-3 d-flex justify-content-center gap-2">
                    <a href="/assets" class="btn btn-primary"><i class="bi bi-box-seam me-2"></i>Ver activos</a>
                    <a href="/import" class="btn btn-outline-secondary"><i class="bi bi-arrow-counterclockwise me-2"></i>Importar otro archivo</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
