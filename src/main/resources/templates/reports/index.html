<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h2>Reportes</h2>
    <ul>
        <li><a href="/reports/assets.xlsx">Exportar activos (Excel)</a></li>
        <li><a href="/reports/assets.pdf">Inventario (PDF)</a></li>
        <li><a href="/reports/summary.pdf">Resumen (PDF)</a></li>
    </ul>

    <hr>

    <h3>Envío de reportes automáticos</h3>
    <form th:action="@{/reports/auto}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="usuario@ejemplo.com" required>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="sendExcel" name="sendExcel" checked>
            <label class="form-check-label" for="sendExcel">Incluir Excel</label>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="sendPdf" name="sendPdf" checked>
            <label class="form-check-label" for="sendPdf">Incluir PDF</label>
        </div>

        <div class="mb-3">
            <label for="intervalDays" class="form-label">Frecuencia (días)</label>
            <select id="intervalDays" name="intervalDays" class="form-select" required>
                <option value="15">Cada 15 días</option>
                <option value="30">Cada 30 días</option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Programar envío</button>
    </form>

    <p class="mt-4"><a href="/">Inicio</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
