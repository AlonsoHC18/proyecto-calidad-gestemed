<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h2>Reportes de Activos</h2>
    <div class="row my-4">
        <div class="col-md-4 mb-2">
            <a href="/reports/assets.xlsx" class="btn btn-success w-100">
                <i class="bi bi-file-earmark-excel"></i> Exportar Excel
            </a>
        </div>
        <div class="col-md-4 mb-2">
            <a href="/reports/assets.pdf" class="btn btn-danger w-100">
                <i class="bi bi-file-earmark-pdf"></i> Exportar PDF
            </a>
        </div>
        <div class="col-md-4 mb-2">
            <button class="btn btn-primary w-100" data-bs-toggle="collapse" data-bs-target="#sendReportForm">
                <i class="bi bi-envelope"></i> Envío de reportes
            </button>
        </div>
    </div>

    <div id="sendReportForm" class="collapse mt-3">
        <form th:action="@{/reports/send}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="sendExcel" name="sendExcel">
                <label class="form-check-label" for="sendExcel">Enviar Excel</label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="sendPdf" name="sendPdf">
                <label class="form-check-label" for="sendPdf">Enviar PDF</label>
            </div>
            <button type="submit" class="btn btn-primary">Enviar Reporte</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
